name: World and X Protocol checks
on:
  push:
    paths:
      - 'public/juegos/x-protocol/**'
      - 'public/app.js'
      - 'public/index.html'
      - 'public/world-entry.js'
      - 'public/juegos/world-start.mjs'
      - 'public/juegos/world-boot.mjs'
      - 'tests/world-boot.test.mjs'
      - 'world-protocol-service.mjs'
      - 'protocol-engine-runtime.mjs'
      - 'protocol-engine-worker.mjs'
      - 'protocol-dedicated-server.mjs'
      - 'protocol-remote-proxy.mjs'
      - 'render.yaml'
      - 'protocol-wire-cadence.mjs'
      - 'protocol-media-delivery.mjs'
      - 'render-protocol-media.yaml'
      - 'tests/protocol-delivery-performance.test.mjs'
      - 'tests/protocol-stage-assets.test.mjs'
      - 'tests/protocol-engine-isolation.test.mjs'
      - 'world-hub.mjs'
      - 'tests/world-auth.test.mjs'
      - 'world.mjs'
      - 'world-companion.mjs'
      - 'world-http-proxy.mjs'
      - 'world-live-delivery.mjs'
      - 'public/juegos/world-ui.mjs'
      - 'tests/protocol-*.test.mjs'
      - '.github/workflows/world-protocol-check.yml'
  pull_request:
    paths:
      - 'public/juegos/x-protocol/**'
      - 'public/app.js'
      - 'public/index.html'
      - 'public/world-entry.js'
      - 'public/juegos/world-start.mjs'
      - 'public/juegos/world-boot.mjs'
      - 'tests/world-boot.test.mjs'
      - 'world-protocol-service.mjs'
      - 'protocol-engine-runtime.mjs'
      - 'protocol-engine-worker.mjs'
      - 'protocol-dedicated-server.mjs'
      - 'protocol-remote-proxy.mjs'
      - 'render.yaml'
      - 'protocol-wire-cadence.mjs'
      - 'protocol-media-delivery.mjs'
      - 'render-protocol-media.yaml'
      - 'tests/protocol-delivery-performance.test.mjs'
      - 'tests/protocol-stage-assets.test.mjs'
      - 'tests/protocol-engine-isolation.test.mjs'
      - 'world-hub.mjs'
      - 'tests/world-auth.test.mjs'
      - 'world.mjs'
      - 'world-companion.mjs'
      - 'world-http-proxy.mjs'
      - 'world-live-delivery.mjs'
      - 'public/juegos/world-ui.mjs'
      - 'tests/protocol-*.test.mjs'
      - '.github/workflows/world-protocol-check.yml'
jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright-core@1.58.2
      - name: Probe real Render World, ceremony engine and media (read-only)
        run: node --test tests/protocol-production-network.test.mjs
      - run: node --check protocol-engine-runtime.mjs && node --check protocol-engine-worker.mjs && node --check protocol-dedicated-server.mjs && node --check protocol-remote-proxy.mjs && node --check protocol-wire-cadence.mjs && node --check protocol-media-delivery.mjs
      - run: node --check public/app.js && node --check public/world-entry.js
      - run: node --check public/juegos/x-protocol/client.mjs && node --check public/juegos/x-protocol/cinema.mjs && node --check public/juegos/world-ui.mjs && node --check world.mjs && node --check world-hub.mjs && node --check world-http-proxy.mjs && node --check world-companion.mjs
      - run: node --test --test-concurrency=2 tests/protocol-bridge-recovery.test.mjs tests/world-protocol-bridge-resilience.test.mjs tests/protocol-18-live-sockets.test.mjs tests/protocol-render-cache.test.mjs tests/protocol-dedicated-service.test.mjs tests/protocol-dedicated-world-network.test.mjs tests/protocol-cinema.test.mjs tests/protocol-official-intro.test.mjs tests/protocol-entry.test.mjs tests/protocol-engine-isolation.test.mjs tests/protocol-delivery-performance.test.mjs tests/protocol-stage-assets.test.mjs tests/protocol-lifecycle.test.mjs tests/protocol-full-ceremony.test.mjs tests/x-protocol-network.test.mjs tests/world-runtime-performance.test.mjs
      - name: Assert real World handoff scripts load BEFORE session exchange
        run: XP_WORLD_AUTH_BROWSER_TEST=1 node --test tests/world-auth.test.mjs
      - name: Check optional World artwork can stall without blocking the player
        run: node --test tests/world-boot.test.mjs
      - name: Verify public desktop iframe intro survives a permanently pending video play()
        run: node --test tests/protocol-world-intro-stall.test.mjs
      - run: node --test tests/protocol-browser-smoke.test.mjs
      - name: Save monitor screenshots (desktop and mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-monitor-visuals
          path: artifacts/protocol-monitor-*.png
          if-no-files-found: ignore
      - run: node --test tests/protocol-staff-home-browser.test.mjs
      - name: Check actual public World boot and STAFF/player lobby buttons in Chromium
        run: node --test tests/protocol-world-entry-browser.test.mjs
      - run: node --test tests/protocol-dedicated-browser.test.mjs
      - name: Test real ceremony interactions, buttons and cross-device synchronization
        run: node --test tests/protocol-interactive-browser.test.mjs
      - name: Save actual button-interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-click-visuals
          path: artifacts/protocol-click-*.png
          if-no-files-found: ignore
