name: World and X Protocol checks
on:
  push:
    paths:
      - 'public/juegos/x-protocol/**'
      - 'world-protocol-service.mjs'
      - 'protocol-engine-runtime.mjs'
      - 'protocol-engine-worker.mjs'
      - 'protocol-wire-cadence.mjs'
      - 'protocol-media-delivery.mjs'
      - 'render-protocol-media.yaml'
      - 'tests/protocol-delivery-performance.test.mjs'
      - 'tests/protocol-stage-assets.test.mjs'
      - 'tests/protocol-engine-isolation.test.mjs'
      - 'world-hub.mjs'
      - 'world.mjs'
      - 'world-companion.mjs'
      - 'world-http-proxy.mjs'
      - 'world-live-delivery.mjs'
      - 'public/juegos/world-ui.mjs'
      - 'tests/protocol-*.test.mjs'
      - '.github/workflows/world-protocol-check.yml'
  pull_request:
    paths:
      - 'public/juegos/x-protocol/**'
      - 'world-protocol-service.mjs'
      - 'protocol-engine-runtime.mjs'
      - 'protocol-engine-worker.mjs'
      - 'protocol-wire-cadence.mjs'
      - 'protocol-media-delivery.mjs'
      - 'render-protocol-media.yaml'
      - 'tests/protocol-delivery-performance.test.mjs'
      - 'tests/protocol-stage-assets.test.mjs'
      - 'tests/protocol-engine-isolation.test.mjs'
      - 'world-hub.mjs'
      - 'world.mjs'
      - 'world-companion.mjs'
      - 'world-http-proxy.mjs'
      - 'world-live-delivery.mjs'
      - 'public/juegos/world-ui.mjs'
      - 'tests/protocol-*.test.mjs'
      - '.github/workflows/world-protocol-check.yml'
jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright-core@1.58.2
      - run: node --check protocol-engine-runtime.mjs && node --check protocol-engine-worker.mjs && node --check protocol-wire-cadence.mjs && node --check protocol-media-delivery.mjs
      - run: node --check public/juegos/x-protocol/client.mjs && node --check public/juegos/x-protocol/cinema.mjs && node --check public/juegos/world-ui.mjs && node --check world.mjs && node --check world-hub.mjs && node --check world-http-proxy.mjs && node --check world-companion.mjs
      - run: node --test --test-concurrency=2 tests/protocol-cinema.test.mjs tests/protocol-official-intro.test.mjs tests/protocol-entry.test.mjs tests/protocol-engine-isolation.test.mjs tests/protocol-delivery-performance.test.mjs tests/protocol-stage-assets.test.mjs tests/protocol-lifecycle.test.mjs tests/protocol-full-ceremony.test.mjs tests/x-protocol-network.test.mjs tests/world-runtime-performance.test.mjs
      - run: node --test tests/protocol-browser-smoke.test.mjs
      - name: Save monitor screenshots (desktop and mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-monitor-visuals
          path: artifacts/protocol-monitor-*.png
          if-no-files-found: ignore
      - run: node --test tests/protocol-staff-home-browser.test.mjs
