name: World and X Protocol checks
on:
  push:
    paths:
      - 'public/juegos/x-protocol/**'
      - 'world-protocol-service.mjs'
      - 'world-hub.mjs'
      - 'tests/protocol-*.test.mjs'
      - '.github/workflows/world-protocol-check.yml'
  pull_request:
    paths:
      - 'public/juegos/x-protocol/**'
      - 'world-protocol-service.mjs'
      - 'world-hub.mjs'
      - 'tests/protocol-*.test.mjs'
      - '.github/workflows/world-protocol-check.yml'
jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node --test tests/protocol-cinema.test.mjs tests/protocol-entry.test.mjs
