name: Import optimized Apocalypse II intro
on:
  push:
    branches:
      - feat/x-protocol-user-intro-20261107
    paths:
      - .github/workflows/import-x-protocol-intro.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch supplied video and create streaming-ready MP4
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p public/juegos/x-protocol/media
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 180 'https://d2ol7oe51mr4n9.cloudfront.net/user_39Xdh0jAJX3Fjm5eNrZVz2isGw6/2fffe914-655d-4b60-bf59-7f2e36756a6b.mp4' -o /tmp/xprotocol-source.mov
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/xprotocol-source.mov
          ffmpeg -hide_banner -loglevel error -y -i /tmp/xprotocol-source.mov -map 0:v:0 -map '0:a:0?' -vf 'scale=854:480:flags=lanczos,fps=30' -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p -profile:v high -level 3.1 -c:a aac -b:a 96k -ar 44100 -movflags +faststart public/juegos/x-protocol/media/intro-apocalypse-ii-20261107.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/juegos/x-protocol/media/intro-apocalypse-ii-20261107.mp4
          test "$(stat -c %s public/juegos/x-protocol/media/intro-apocalypse-ii-20261107.mp4)" -lt 4000000
      - name: Commit user's optimized intro to the project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/juegos/x-protocol/media/intro-apocalypse-ii-20261107.mp4
          if git diff --cached --quiet; then
            echo "The official intro is already present."
          else
            git commit -m "media(protocol): add user-supplied 14.83s optimized official intro"
            git push origin HEAD:feat/x-protocol-user-intro-20261107
          fi
