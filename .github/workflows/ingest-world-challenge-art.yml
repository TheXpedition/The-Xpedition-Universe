name: Vendor uploaded challenge artwork
on:
  push:
    branches:
      - feat/world-challenge-cards-and-permanent-server-removal-20261108
    paths:
      - scripts/ingest-world-challenge-art.py
      - scripts/world-challenge-art-sources.json
      - .github/workflows/ingest-world-challenge-art.yml
permissions:
  contents: write
jobs:
  vendor-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Download and optimize original creator artwork
        run: python scripts/ingest-world-challenge-art.py
      - name: Commit images to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/juegos/challenge-catalog/art/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(world): vendor 14 optimized original challenge logos"
          git push origin "HEAD:${GITHUB_REF_NAME}"
