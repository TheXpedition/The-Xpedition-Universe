name: The X Protocol - real screen interactions
on:
  pull_request:
    paths:
      - 'tests/protocol-interactive-browser.test.mjs'
      - 'public/juegos/x-protocol/**'
      - '.github/workflows/protocol-visual-interaction-check.yml'
  workflow_dispatch:
jobs:
  interact-with-ceremony:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright-core@1.58.2
      - name: Click the actual UI in Chromium and measure synchronization
        run: node --test tests/protocol-interactive-browser.test.mjs
      - name: Upload click-by-click screenshots including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-interaction-screenshots
          path: artifacts/protocol-click-*.png
          if-no-files-found: ignore
