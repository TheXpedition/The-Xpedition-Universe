# Este servicio y su disco pueden generar cargos en Render.
# Revisa el importe en su panel antes de confirmar la creación.
services:
  - type: web
    name: the-xpedition-universe
    runtime: node
    buildCommand: node --version
    startCommand: node server.mjs
    plan: starter
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_URL
        sync: false
    disk:
      name: xpedition-datos
      mountPath: /var/data
      sizeGB: 1
