# Render Free + Supabase Free. Sin disco de pago.
# Configura los valores privados en Render, nunca en GitHub.
services:
  - type: web
    name: the-xpedition-universe
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    plan: free
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PERSISTENCE_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: TRUST_PROXY
        value: "true"
