<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>María · Prueba de movimiento</title><link rel="stylesheet" href="/juegos/maria-animation.css"></head>
