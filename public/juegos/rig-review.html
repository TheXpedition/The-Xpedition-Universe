<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonju · Diseño corregido</title><script src="/world-config.js"></script><link rel="stylesheet" href="/juegos/art/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#101c28;color:#edf2f4;font:15px system-ui}main{max-width:1420px;margin:auto;padding:20px 28px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font:800 36px 'World Condensed',sans-serif;margin:3px 0}p{color:#b9c5ce;margin:5px 0}.tag{color:#e6c780;font-size:11px;letter-spacing:2px}a{color:#c1d5df;font-size:13px;text-decoration:none}.state{font-size:12px;color:#ecd59e;border:1px solid #a48b5255;border-radius:30px;padding:8px 12px;white-space:nowrap}.stage{margin-top:16px;border:1px solid #586068;border-radius:12px;overflow:hidden;background:#eeeae3}canvas{width:100%;height:calc(100dvh - 252px);min-height:490px;max-height:880px;display:block}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0 5px}button{font:600 13px system-ui;border:1px solid #546d7b;background:#203443;color:#f4f8fc;border-radius:7px;padding:10px 13px;cursor:pointer}button[aria-pressed=true]{background:#e5c77b;color:#172c38;border-color:#f5dba1}button:disabled{color:#8d99a1;background:#1b2a36;border-color:#344652;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #a7dfff;outline-offset:3px}.divider{height:27px;border-left:1px solid #495b65;margin:0 3px}.count{font-size:12px;color:#c5d0d6;margin-left:auto}.note{font-size:12px;color:#acbbc5;line-height:1.5;max-width:1000px}footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:8px}.stage-note{font-size:11px;color:#8398a6}@media(max-width:700px){main{padding:15px 10px}h1{font-size:29px}.state{display:none}canvas{height:68dvh;min-height:460px}.controls{gap:6px}button{padding:9px;font-size:12px}.divider{display:none}.count{margin-left:0;width:100%}header>a{font-size:12px}p{font-size:13px}footer{align-items:flex-start}.stage-note{display:none}}
</style><script type="module" src="/juegos/rig-review.mjs"></script></head>
<body><main><header><div><span class="tag">THE XPEDITION · REVISIÓN STAFF</span><h1>Bonju · diseño corregido</h1><p id="status" role="status">Cargando la nueva versión…</p></div><span class="state" id="review-state">Prueba de animación</span><a href="/juegos/">Volver a World ↗</a></header>
<section class="stage" aria-label="Comparación de la ilustración y el montaje reconstruido"><canvas id="rig" role="img" aria-label="Bonju original a la izquierda y montaje por piezas a la derecha, a la misma escala"></canvas></section>
<nav class="controls" aria-label="Controles de revisión"><button id="pivots" aria-pressed="false" disabled>Mostrar articulaciones</button><button data-animation="neutral" aria-pressed="true" disabled>Pose original</button><button data-animation="idle" aria-pressed="false" disabled>Respirar</button><button data-animation="blink" aria-pressed="false" disabled>Parpadear</button><button data-animation="talk" aria-pressed="false" disabled>Hablar</button><button data-animation="walk" disabled title="Marcha en revisión de caderas y zapatos">Caminar</button><button disabled title="Pendiente de revisar las deformaciones">Sentarse</button><button id="pause" aria-pressed="false">Pausar</button><label class="count">Velocidad <select id="speed" aria-label="Velocidad de animación"><option value="1">1×</option><option value="0.5">0,5×</option><option value="0.25">0,25×</option></select></label><span id="part-count" class="count"></span></nav>
<footer><p class="note">Prueba de respiración, parpadeo y habla con el diseño nuevo. La marcha y la pose sentada siguen en revisión.</p><span class="stage-note">Fondo neutro · escala uniforme</span></footer>
</main></body></html>
