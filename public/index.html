<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="description" content="Explora The Xpedition. Temporadas, participantes, simuladores y una comunidad para vivir la próxima aventura juntos.">
  <title>The Xpedition — Tu próxima aventura</title>
  <link rel="icon" type="image/png" href="personajes/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="streaming.css">
  <script defer src="app.js"></script>
  <script defer src="streaming.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="shell">
    <header class="topbar">
      <a href="#inicio" class="stream-brand" aria-label="The Xpedition, inicio"><span>THE</span>XPEDITION<small>UNIVERSE</small></a>
      <nav id="navigation" aria-label="Navegación principal"></nav>
      <div class="top-actions">
        <button class="search-trigger" data-action="search" aria-label="Buscar en el universo"><span data-icon="search"></span></button>
        <span class="connection" id="connection" title="Estado del servidor"><i></i><span>Conectando</span></span>
        <div id="accountActions"></div>
      </div>
    </header>
    <main id="main" tabindex="-1"><div class="loading-screen"><span class="spinner"></span> Preparando tu próxima aventura…</div></main>
    <footer class="site-footer">THE XPEDITION UNIVERSE <span>Una comunidad. Muchas historias.</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modalTitle"><div class="modal-inner"><button class="icon-button modal-close" data-action="close-modal" aria-label="Cerrar">×</button><div id="modalContent"></div></div></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input type="file" id="attachmentInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <noscript>Activa JavaScript para usar The Xpedition.</noscript>
</body>
</html>
