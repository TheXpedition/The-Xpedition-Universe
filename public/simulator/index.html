<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13121c"><title>The Xpedition · Simulador</title><link rel="icon" href="/personajes/bonju.png"><link rel="stylesheet" href="/simulator/simulator.css"><script defer src="/simulator/simulator.js"></script></head>
<body>
 <header class="sim-bar"><a class="sim-brand" href="/#simuladores"><span>THE</span> XPEDITION <small>SIMULATOR</small></a><div class="sim-tools" id="simTools"></div></header>
 <main id="simMain"><section class="sim-loading"><span class="sim-spinner"></span><p>Preparando tu expedición…</p></section></main>
 <dialog id="shopDialog" aria-labelledby="shopTitle"><div id="shopContent"></div></dialog>
 <dialog id="resumeDialog" aria-labelledby="resumeTitle"><div class="resume-copy"><span class="sim-kicker">TU EXPEDICIÓN SIGUE AQUÍ</span><h1 id="resumeTitle">Hay una historia<br>sin terminar.</h1><p id="resumeDescription"></p><div class="resume-meta" id="resumeMeta"></div><button class="sim-button primary" id="resumeGame">Continuar partida <span>→</span></button><button class="sim-button subtle" id="archiveGame">Archivar y comenzar otra</button><a href="/#simuladores">Volver al universo</a></div><div class="resume-art" aria-hidden="true"></div></dialog>
 <dialog id="progressDialog" aria-labelledby="progressTitle"><div class="progress-panel"><button class="sim-close" data-close aria-label="Cerrar">×</button><span class="sim-kicker">TU PASAPORTE AL UNIVERSO</span><h1 id="progressTitle">Cada aventura cuenta.</h1><div id="progressContent"></div></div></dialog>
 <div class="sim-toasts" id="simToasts" aria-live="polite"></div>
</body></html>
